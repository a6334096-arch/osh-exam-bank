<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>職安行動題庫</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:24px;line-height:1.7;background:#f7f9fb;color:#172331}main{background:white;padding:24px;border-radius:16px}small{color:#586575}</style></head><body><main><h1>職安行動題庫</h1><p>題庫資料建置中。已校正題目才會納入正式練習。</p><p id="count">讀取資料中…</p><small>法規題以實際核對的生效條文為準；未經核對不提供正確答案保證。</small></main><script>fetch('./data/questions.json').then(r=>r.json()).then(d=>{let v=d.questions.filter(q=>q.status==='verified').length;document.getElementById('count').textContent='目前已匯入 '+d.questions.length+' 題，其中已核對 '+v+' 題。'}).catch(()=>document.getElementById('count').textContent='資料尚未載入');</script></body></html>
