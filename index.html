<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>職安行動題庫</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#1b2838;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#12375a;color:white;padding:20px 16px}header>div,main{max-width:760px;margin:auto}h1{font-size:1.35rem;margin:0 0 6px}main{padding:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #c8d5e2;border-radius:10px;padding:12px;background:white;color:#153a60}.tabs button{flex:1}.tabs .active,.primary{background:#1259a0;color:white}.card{background:white;border:1px solid #e0e6ee;border-radius:16px;padding:18px;margin-bottom:14px}h2{font-size:1.15rem;margin-top:0}.muted{color:#64748b;font-size:.9rem}.option{display:block;border:1px solid #d5dfea;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#1266b3;background:#edf6ff}.option input{margin-right:8px}.result{border-left:4px solid #217a58;background:#f0f8f3;padding:14px;border-radius:8px;margin-top:16px}.wrong{border-left-color:#bd4a3f;background:#fff4f2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.hidden{display:none}a{color:#1259a0;overflow-wrap:anywhere}.notice{background:#fff8e8;border:1px solid #e9d8a4;padding:12px;border-radius:10px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filters select{display:block;width:100%;min-height:44px;margin-top:6px;padding:10px;border:1px solid #cad4e1;border-radius:10px;background:white;color:inherit}small{font-size:.85rem}@media(max-width:480px){.filters{grid-template-columns:1fr}main{padding:12px}.card{padding:15px}}</style></head><body><header><div><h1>職業安全衛生行動題庫</h1><div>答案解析・互動練習・法規核對狀態</div></div></header><main><nav class="tabs"><button id="practiceTab" class="active">練習模式</button><button id="reviewTab">答案解析版</button></nav><div class="card"><label>題目搜尋 <input id="search" placeholder="輸入關鍵字" style="width:100%;padding:12px;margin-top:6px;border:1px solid #cad4e1;border-radius:10px"></label><p id="stats" class="muted">載入中…</p><div class="filters">
<label>題目主題 <select id="topicFilter"><option value="all">全部主題</option></select></label>
<label>核對狀態 <select id="statusFilter">
<option value="all">全部狀態</option><option value="verified">已核對</option><option value="unverified">待核對</option><option value="needs_review">跨頁重建／有疑義</option>
</select></label>
<label id="practiceRangeLabel">作答題目區間 <select id="practiceRange" disabled><option value="all">全部符合條件的題目</option></select></label>
</div><p class="notice"><strong>注意：</strong>未核對題目僅供練習，所顯示的答案為舊 PDF 原始答案，可能不符合現行法規；正式備考請優先採用已核對題目。</p></div><div id="content"></div></main><script src="./topics.js"></script><script>
let questions=[],mode='practice',index=0,selected=null,submitted=false;
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels=['①','②','③','④'];
const questionsPerRange=25;
function filtered(){
  const term=el('search').value.trim().toLowerCase();
  const status=el('statusFilter').value;
  const topic=el('topicFilter').value;
  return questions.filter(q=>
    (status==='all'||q.status===status)&&
    (topic==='all'||q.topic===topic)&&
    (!term||(q.question||'').toLowerCase().includes(term)||q.options.some(x=>String(x).toLowerCase().includes(term))));
}

function updatePracticeRanges(){
  const range=el('practiceRange');
  const count=filtered().length;
  range.replaceChildren(new Option('全部符合條件的題目','all'));
  for(let start=0;start<count;start+=questionsPerRange){
    const end=Math.min(start+questionsPerRange,count);
    const label=end===start+1?'第 '+end+' 題':'第 '+(start+1)+'–'+end+' 題';
    range.add(new Option(label,String(start)));
  }
  range.disabled=count===0;
  range.value=count?'0':'all';
}

function populateTopics(){
  const counts=new Map();
  for(const {topic} of questions) counts.set(topic,(counts.get(topic)||0)+1);
  for(const topic of topicNames){
    if(counts.has(topic)) el('topicFilter').add(new Option(topic+'（'+counts.get(topic)+' 題）',topic));
  }
}
function explanation(q){return '<div class="result '+(mode==='practice'&&selected!==q.answer?'wrong':'')+'"><strong>'+(q.status==='verified'?'已核對答案：':'原始 PDF 參考答案（未核對）：')+(q.answer===null?'尚待核對':labels[q.answer]+' '+esc(q.options[q.answer]))+'</strong>'+(q.status==='needs_review'?'<p><strong>跨頁重建題：題幹或選項可能有擷取錯誤，請對照原始 PDF。</strong></p>':'')+'<p>'+esc(q.explanation||'本題尚無經核對的解析，請勿將舊題庫答案視為現行法規正解。')+'</p><small>核對狀態：'+(q.status==='verified'?'已核對':q.status==='needs_review'?'有疑義':'待核對')+'　核對日期：'+esc(q.verified_at||'未核對')+'</small>'+(q.source_url?'<p><a target="_blank" rel="noopener" href="'+esc(q.source_url)+'">查看法規來源</a></p>':'')+'</div>'}
function render(){const matches=filtered();
const range=el('practiceRange').value;
const limited=mode==='practice'&&range!=='all'&&range!=='';
const offset=limited?Number(range):0;
const a=limited?matches.slice(offset,offset+questionsPerRange):matches;
el('practiceRangeLabel').hidden=mode!=='practice';
el('stats').textContent=(limited?'本區間 '+a.length+' 題／':'')+'符合條件 '+matches.length+' 題／全部 '+questions.length+' 題；已核對 '+questions.filter(q=>q.status==='verified').length+' 題；未核對答案僅供參考';el('practiceTab').classList.toggle('active',mode==='practice');el('reviewTab').classList.toggle('active',mode==='review');if(!a.length){el('content').innerHTML='<div class="card notice"><strong>目前沒有符合條件的題目。</strong><p>請調整關鍵字、主題或核對狀態。</p></div>';return}index=Math.max(0,Math.min(index,a.length-1));const q=a[index];let out='<section class="card"><div class="muted">第 '+(offset+index+1)+' / '+matches.length+' 題　來源：'+esc(q.source_document||'未標示')+'</div><p class="muted question-topic">'+esc(q.topic)+'</p><h2>'+esc(q.question)+'</h2>';q.options.forEach((o,i)=>out+='<label class="option"><input type="radio" name="choice" value="'+i+'" '+(selected===i?'checked ':'')+(submitted||mode==='review'?'disabled':'')+'>'+labels[i]+' '+esc(o)+'</label>');if(mode==='review'||submitted)out+=explanation(q);out+='<div class="actions">';if(mode==='practice'&&!submitted)out+='<button class="primary" id="submit" '+(selected===null?'disabled':'')+'>確認答案</button>';out+='<button id="prev" '+(index===0?'disabled':'')+'>上一題</button><button id="next" '+(index===a.length-1?'disabled':'')+'>下一題</button></div></section>';el('content').innerHTML=out;document.querySelectorAll('input[name=choice]').forEach(r=>r.onchange=()=>{selected=Number(r.value);render()});const submit=el('submit');if(submit)submit.onclick=()=>{submitted=true;render()};el('prev').onclick=()=>{index--;selected=null;submitted=false;render()};el('next').onclick=()=>{index++;selected=null;submitted=false;render()}}
function reset(){index=0;selected=null;submitted=false;render()}el('practiceTab').onclick=()=>{mode='practice';reset()};el('reviewTab').onclick=()=>{mode='review';reset()};function resetFilters(){
  updatePracticeRanges();
  reset();
}
el('search').oninput=resetFilters;
el('statusFilter').onchange=resetFilters;
el('topicFilter').onchange=resetFilters;
el('practiceRange').onchange=reset;
fetch('./data/questions.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{questions=Array.isArray(d.questions)?d.questions.map(q=>({...q,topic:topicForQuestion(q)})):[];populateTopics();const pending=questions.filter(q=>q.status==='needs_review').length;el('statusFilter').querySelector('[value=needs_review]').textContent='跨頁重建／有疑義（'+pending+' 題）';resetFilters()}).catch(()=>{el('stats').textContent='題庫載入失敗';el('content').textContent='請稍後重新整理頁面。'});
</script></body></html>
