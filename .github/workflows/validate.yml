name: Validate question bank
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - name: Check staged PDF import (if uploaded)
        shell: bash
        run: |
          if [ -f data/staging/questions_candidate.json ]; then
            python scripts/check_staged_import.py data/staging/questions_candidate.json
          else
            echo 'No staged import yet; live question bank unchanged.'
          fi
